version: '3.8'

services:
  # DATABASE SERVICE
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file:
      - ./engineering/backend/.env
    ports:
      - "5432:5432"
    volumes:
      - ./engineering/backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./engineering/backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./engineering/backend/sql/seed_mock_data.sql:/docker-entrypoint-initdb.d/03-seed_mock_data.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d market_lens_database"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # BACKEND API SERVICE
  backend:
    build:
      context: ./engineering/backend
      dockerfile: Dockerfile.backend
      target: api
    container_name: go_backend_api
    ports:
      - "8080:8080"
    env_file:
      - ./engineering/backend/.env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  # BACKEND MCP SERVICE
  backend-mcp:
    build:
      context: ./engineering/backend
      dockerfile: Dockerfile.backend
      target: mcp
    container_name: go_backend_mcp
    ports:
      - "9090:9090"
    env_file:
      - ./engineering/backend/.env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  # FRONTEND SERVICE 
  frontend:
    build:
      context: ./engineering/frontend
      dockerfile: Dockerfile.frontend
    container_name: nextjs_app
    ports:
      - "3000:3000"
    env_file:
      - ./engineering/frontend/.env
    depends_on:
      - backend
    networks:
      - app-network

  # CRAWLER SERVICE 
  crawler:
    build:
      context: ./engineering/crawler
      dockerfile: Dockerfile.crawler
    container_name: python_crawler
    profiles: ["crawler"]
    env_file:
      - ./engineering/crawler/.env
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  # THUNDER ID 
  thunder-setup:
    image: ghcr.io/thunder-id/thunderid:1.0.0
    profiles: ["setup"] 
    entrypoint: ["./setup.sh"]
    restart: "no"
    env_file:
      - ./engineering/thunder/.env
    volumes:
      - ./engineering/thunder/deployment.yaml:/opt/thunderid/deployment.yaml
      - thunderid-data:/opt/thunderid/database
      - thunderid-certs:/opt/thunderid/config/certs
      - thunderid-secrets:/opt/thunderid/config/secrets
    networks:
      - app-network

  thunder:
    image: ghcr.io/thunder-id/thunderid:1.0.0
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - ./engineering/thunder/.env 
    volumes:
      - ./engineering/thunder/deployment.yaml:/opt/thunderid/deployment.yaml
      - thunderid-data:/opt/thunderid/database
      - thunderid-certs:/opt/thunderid/config/certs:ro
      - thunderid-secrets:/opt/thunderid/config/secrets:ro
    networks:
      - app-network

volumes:
  pgdata:
  thunderid-data:
  thunderid-certs:
  thunderid-secrets:

networks:
  app-network:
    driver: bridge
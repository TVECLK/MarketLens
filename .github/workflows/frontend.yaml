name: Frontend Test

on:
    push:
        branches: ["main", "fix/frontend-workflow"]
        paths:
            - "engineering/frontend/**"
            - ".github/workflows/frontend.yaml"
    pull_request:
        branches: ["main", "fix/frontend-workflow"]
        paths:
            - "engineering/frontend/**"
            - ".github/workflows/frontend.yaml"

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: engineering/frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: engineering/frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Set up docker buildx
              uses: docker/setup-buildx-action@v3

            - name: Build crawler image
              uses: docker/build-push-action@v6
              with:
                  context: ./engineering/frontend
                  file: ./engineering/frontend/Dockerfile.frontend
                  push: false
                  load: true
                  tags: frontend:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

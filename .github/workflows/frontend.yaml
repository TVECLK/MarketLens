name: Frontend Test

on:
    push:
        branches: ["main", "fix/frontend-workflow"]
        paths:
            - "engineering/frontend/**"
            - ".github/workflows/frontend.yaml"
    pull_request:
        branches: ["main", "fix/frontend-workflow"]
        paths:
            - "engineering/frontend/**"
            - ".github/workflows/frontend.yaml"

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: engineering/frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: engineering/frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run tests
              run: npm test

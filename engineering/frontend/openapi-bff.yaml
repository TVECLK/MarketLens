openapi: 3.0.3
info:
  title: Labour Market Analysis Project - BFF
  description: >
    Backend-for-Frontend layer, built with Next.js Route Handlers.
    Every route here proxies (and in several cases fans out to and aggregates)
    calls to the Go backend at GO_BACKEND_URL — the frontend never calls the Go
    backend directly. Error responses from the Go backend are forwarded through
    unmodified, including the original status code.
  version: "1.0.0"
  contact:
    name: TVEC
    url: https://github.com/TVECLK/MarketLens

servers:
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: health
  - name: dashboard
  - name: occupation-hierarchy
  - name: industry-hierarchy
  - name: analysis
  - name: occupation-skills

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        ThunderID-issued access token. Send as `Authorization: Bearer <token>`.

  parameters:
    fromDateOptional:
      name: from-date
      in: query
      required: false
      schema: { type: string, format: date }
      description: Start date, YYYY-MM-DD. Forwarded to the Go backend as-is.
    toDateOptional:
      name: to-date
      in: query
      required: false
      schema: { type: string, format: date }
      description: End date, YYYY-MM-DD. Forwarded to the Go backend as-is.
    fromDateRequired:
      name: from-date
      in: query
      required: true
      schema: { type: string, format: date }
      description: Start date, YYYY-MM-DD.
    toDateRequired:
      name: to-date
      in: query
      required: true
      schema: { type: string, format: date }
      description: End date, YYYY-MM-DD.
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Numeric ID of the parent resource.
    standardPath:
      name: standard
      in: path
      required: true
      schema: { type: string, enum: [occupation, industry] }
    levelPath:
      name: level
      in: path
      required: true
      schema: { type: string }
      description: >
        Hierarchy level name — for occupation: major-group, sub-major-group,
        minor-group, unit-group, occupation-group. For industry: industry-sector,
        industry-division, industry-group, industry-class, industry-subclass.
    occupationLevelPath:
      name: level
      in: path
      required: true
      schema:
        type: string
        enum: [major-group, sub-major-group, minor-group, unit-group, occupation-group]
    limitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20 }
    offsetQuery:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0 }

  responses:
    BadRequest:
      description: Invalid request, forwarded from the Go backend unmodified.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpstreamOrServerError:
      description: >
        Either the Go backend returned an error (forwarded with its original
        status code), or the BFF itself failed to reach the backend (500).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: The Go backend is unreachable or unhealthy.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        details: { type: string }
        reason: { type: string }

    StatusResponse:
      type: object
      properties:
        status: { type: string }

    # ---- Dashboard overview ----

    VacancyTrendPoint:
      type: object
      properties:
        label: { type: string }
        open_job_count: { type: integer }

    VacancyTrendResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        granularity: { type: string, enum: [weekly, monthly] }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/VacancyTrendPoint' }

    VacancyTotalResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        total_vacancies: { type: integer }

    OccupationDateRangeStat:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    OccupationsByDateRangeResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        occupations:
          type: array
          items: { $ref: '#/components/schemas/OccupationDateRangeStat' }

    IndustryDateRangeStat:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    IndustriesByDateRangeResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        industries:
          type: array
          items: { $ref: '#/components/schemas/IndustryDateRangeStat' }

    DashboardOverviewResponse:
      type: object
      description: Fans out to vacancy-trend, vacancy-total, occupations/by-date-range, and industries/by-date-range on the Go backend, in parallel.
      properties:
        vacancy_trend: { $ref: '#/components/schemas/VacancyTrendResponse' }
        vacancy_total: { $ref: '#/components/schemas/VacancyTotalResponse' }
        by_occupation: { $ref: '#/components/schemas/OccupationsByDateRangeResponse' }
        by_industry: { $ref: '#/components/schemas/IndustriesByDateRangeResponse' }

    # ---- Hierarchy passthrough ----

    HierarchyNode:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }

    MajorGroupListResponse:
      type: object
      properties:
        count: { type: integer }
        major_groups:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    SubMajorGroupChildrenResponse:
      type: object
      properties:
        major_group_id: { type: integer }
        count: { type: integer }
        sub_major_groups:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    MinorGroupChildrenResponse:
      type: object
      properties:
        sub_major_group_id: { type: integer }
        count: { type: integer }
        minor_groups:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    UnitGroupChildrenResponse:
      type: object
      properties:
        minor_group_id: { type: integer }
        count: { type: integer }
        unit_groups:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    OccupationGroupChildrenResponse:
      type: object
      properties:
        unit_group_id: { type: integer }
        count: { type: integer }
        occupation_groups:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    IndustrySectorListResponse:
      type: object
      properties:
        count: { type: integer }
        industry_sectors:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    IndustryDivisionChildrenResponse:
      type: object
      properties:
        industry_sector_id: { type: integer }
        count: { type: integer }
        industry_divisions:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    IndustryGroupChildrenResponse:
      type: object
      properties:
        industry_division_id: { type: integer }
        count: { type: integer }
        industry_groups:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    IndustryClassChildrenResponse:
      type: object
      properties:
        industry_group_id: { type: integer }
        count: { type: integer }
        industry_classes:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    IndustrySubclassChildrenResponse:
      type: object
      properties:
        industry_class_id: { type: integer }
        count: { type: integer }
        industry_subclasses:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    # ---- Combined analysis ----

    TotalJobCountResult:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        total_job_count: { type: integer }

    ChildJobCount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        open_job_count: { type: integer }

    ChildrenResult:
      type: object
      nullable: true
      description: Null when the selected level is a leaf (occupation-group / industry-subclass), which has no children.
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        child_level: { type: string }
        count: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/ChildJobCount' }

    EmploymentSectorStat:
      type: object
      properties:
        id: { type: integer }
        sector: { type: string }
        open_job_count: { type: integer }

    ExperienceStat:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    ProvinceStat:
      type: object
      properties:
        id: { type: integer }
        province: { type: string }
        lat: { type: number, format: float }
        lng: { type: number, format: float }
        open_job_count: { type: integer }

    EducationLevelStat:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        open_job_count: { type: integer }

    FormalityStat:
      type: object
      properties:
        id: { type: integer }
        formality_type: { type: string }
        open_job_count: { type: integer }

    GenderStat:
      type: object
      properties:
        id: { type: integer }
        gender_type: { type: string }
        open_job_count: { type: integer }

    VocationalEducationStat:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        open_job_count: { type: integer }

    JobTypeStat:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        open_job_count: { type: integer }

    RemoteOnSiteStat:
      type: object
      properties:
        remote_count: { type: integer }
        on_site_count: { type: integer }

    OccupationAnalysisResponse:
      type: object
      description: >
        Fans out to all ten generic Go breakdown endpoints for the given
        standard/level/id in parallel. "children" is the only field that may be
        null (leaf levels) without the whole request failing.
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: string }
        from_date: { type: string, nullable: true }
        to_date: { type: string, nullable: true }
        total_job_count: { $ref: '#/components/schemas/TotalJobCountResult' }
        children: { $ref: '#/components/schemas/ChildrenResult' }
        employment_sector:
          type: object
          properties:
            employment_sectors:
              type: array
              items: { $ref: '#/components/schemas/EmploymentSectorStat' }
        experience:
          type: object
          properties:
            experiences:
              type: array
              items: { $ref: '#/components/schemas/ExperienceStat' }
        province:
          type: object
          properties:
            provinces:
              type: array
              items: { $ref: '#/components/schemas/ProvinceStat' }
        education:
          type: object
          properties:
            education_levels:
              type: array
              items: { $ref: '#/components/schemas/EducationLevelStat' }
        formality:
          type: object
          properties:
            formalities:
              type: array
              items: { $ref: '#/components/schemas/FormalityStat' }
        gender:
          type: object
          properties:
            genders:
              type: array
              items: { $ref: '#/components/schemas/GenderStat' }
        vocational_education:
          type: object
          properties:
            vocational_educations:
              type: array
              items: { $ref: '#/components/schemas/VocationalEducationStat' }
        remote_onsite:
          type: object
          properties:
            remote_vs_onsite: { $ref: '#/components/schemas/RemoteOnSiteStat' }
        job_type:
          type: object
          properties:
            job_types:
              type: array
              items: { $ref: '#/components/schemas/JobTypeStat' }

    # ---- Occupation skills ----

    SkillStat:
      type: object
      properties:
        id: { type: integer }
        skill: { type: string }
        open_job_count: { type: integer }

    Top15SkillsResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillStat' }

    AllSkillsResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillStat' }

    EmployerStat:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    TopHiringEmployersResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        employers:
          type: array
          items: { $ref: '#/components/schemas/EmployerStat' }

    OccupationSkillsResponse:
      type: object
      description: Fans out to top-15-skills, all-skills, and top-hiring-employers on the Go backend in parallel.
      properties:
        level: { type: string }
        id: { type: string }
        from_date: { type: string, nullable: true }
        to_date: { type: string, nullable: true }
        top_15_skills: { $ref: '#/components/schemas/Top15SkillsResponse' }
        all_skills: { $ref: '#/components/schemas/AllSkillsResponse' }
        top_hiring_employers: { $ref: '#/components/schemas/TopHiringEmployersResponse' }

    # ---- Flat KPI reference tables (CRUD passthrough) ----

    EmploymentSector:
      type: object
      properties:
        id: { type: integer }
        sector: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Experience:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EducationLevel:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Formality:
      type: object
      properties:
        id: { type: integer }
        formality_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Gender:
      type: object
      properties:
        id: { type: integer }
        gender_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VocationalEducation:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Hierarchy CRUD passthrough ----

    PaginatedHierarchyListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

paths:

  # ============================================================
  # HEALTH
  # ============================================================
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Confirms the Next.js server itself is up — no dependencies checked.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: Confirms the BFF can reach the Go backend's own /healthz endpoint.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ============================================================
  # DASHBOARD OVERVIEW
  # ============================================================
  /dashboard/overview:
    get:
      tags: [dashboard]
      summary: Combined national dashboard overview
      description: >
        Fans out to four Go backend endpoints in parallel (vacancy-trend,
        vacancy-total, occupations/by-date-range, industries/by-date-range)
        and returns them combined under one response.
      parameters:
        - { $ref: '#/components/parameters/fromDateOptional' }
        - { $ref: '#/components/parameters/toDateOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardOverviewResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/UpstreamOrServerError'

  # ============================================================
  # OCCUPATION HIERARCHY (proxied)
  # ============================================================
  /v1/occupation/major-groups:
    get:
      tags: [occupation-hierarchy]
      summary: List major groups
      parameters:
        - { $ref: '#/components/parameters/fromDateOptional' }
        - { $ref: '#/components/parameters/toDateOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MajorGroupListResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/UpstreamOrServerError'
    post:
      tags: [occupation-hierarchy]
      summary: Create a major group
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HierarchyNode' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HierarchyNode' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/occupation/major-groups/{id}:
    get:
      tags: [occupation-hierarchy]
      summary: Get a major group by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HierarchyNode' }
        '404': { $ref: '#/components/responses/UpstreamOrServerError' }
    put:
      tags: [occupation-hierarchy]
      summary: Update a major group
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HierarchyNode' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HierarchyNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [occupation-hierarchy]
      summary: Delete (soft-delete) a major group
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/occupation/major-groups/{id}/sub-major-groups:
    get:
      tags: [occupation-hierarchy]
      summary: List sub major groups under a major group
      parameters:
        - { $ref: '#/components/parameters/idPath' }
        - { $ref: '#/components/parameters/fromDateOptional' }
        - { $ref: '#/components/parameters/toDateOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubMajorGroupChildrenResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/UpstreamOrServerError'

  /v1/occupation/sub-major-groups/{id}/minor-groups:
    get:
      tags: [occupation-hierarchy]
      summary: List minor groups under a sub major group
      parameters:
        - { $ref: '#/components/parameters/idPath' }
        - { $ref: '#/components/parameters/fromDateOptional' }
        - { $ref: '#/components/parameters/toDateOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinorGroupChildrenResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/UpstreamOrServerError'

  /v1/occupation/minor-groups/{id}/unit-groups:
    get:
      tags: [occupation-hierarchy]
      summary: List unit groups under a minor group
      parameters:
        - { $ref: '#/components/parameters/idPath' }
        - { $ref: '#/components/parameters/fromDateOptional' }
        - { $ref: '#/components/parameters/toDateOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitGroupChildrenResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/UpstreamOrServerError'

  /v1/occupation/unit-groups/{id}/occupation-groups:
    get:
      tags: [occupation-hierarchy]
      summary: List occupation groups under a unit group
      parameters:
        - { $ref: '#/components/parameters/idPath' }
        - { $ref: '#/components/parameters/fromDateOptional' }
        - { $ref: '#/components/parameters/toDateOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccupationGroupChildrenResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/UpstreamOrServerError'

  /v1/occupation/sub-major-groups:
    get:
      tags: [occupation-hierarchy]
      summary: List sub major groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HierarchyNode' }
    post:
      tags: [occupation-hierarchy]
      summary: Create a sub major group
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HierarchyNode' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HierarchyNode' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/occupation/sub-major-groups/{id}:
    get:
      tags: [occupation-hierarchy]
      summary: Get a sub major group by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HierarchyNode' }
        '404': { $ref: '#/components/responses/UpstreamOrServerError' }
    put:
      tags: [occupation-hierarchy]
      summary: Update a sub major group
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HierarchyNode' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HierarchyNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [occupation-hierarchy]
      summary: Delete (soft-delete) a sub major group
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/occupation/minor-groups:
    get:
      tags: [occupation-hierarchy]
      summary: List minor groups
      responses:

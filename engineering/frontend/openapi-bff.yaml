  # ============================================================
  # COMBINED ANALYSIS
  # ============================================================
  /v1/analysis/{standard}/{level}/{id}:
    get:
      tags: [analysis]
      summary: Combined analysis for a hierarchy level
      description: >
        Fans out to all ten generic Go breakdown endpoints for the given
        standard/level/id in parallel and returns them combined. The
        "children" field is null (not a request failure) when the level is a
        leaf (occupation-group / industry-subclass).
      parameters:
        - { $ref: '#/components/parameters/standardPath' }
        - { $ref: '#/components/parameters/levelPath' }
        - { $ref: '#/components/parameters/idPath' }
        - { $ref: '#/components/parameters/fromDateOptional' }
        - { $ref: '#/components/parameters/toDateOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccupationAnalysisResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/UpstreamOrServerError'

  # ============================================================
  # OCCUPATION SKILLS (combined)
  # ============================================================
  /v1/occupation/skills/{level}/{id}:
    get:
      tags: [occupation-skills]
      summary: Combined skills analysis for an occupation hierarchy level
      description: >

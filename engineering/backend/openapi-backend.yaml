openapi: 3.0.3
info:
  title: Labour Market Analysis Project - Backend
  description: >
    National labour market demand for Sri Lanka.
    Endpoints are grouped into: health checks, flat KPI reference tables,
    the occupation (SLSCO) and industry (SLSIC) classification hierarchies,
    generic level-scoped analysis, occupation skills/employer analysis,
    national vacancy trend and totals and crawler run monitoring.
  version: "1.0.0"
  contact:
    name: TVEC
    url: https://github.com/TVECLK/MarketLens
  license:
    name: Apache-2.0
    url: https://github.com/TVECLK/MarketLens#Apache-2.0-1-ov-file

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: health
  - name: kpi-employment-sectors
  - name: kpi-experiences
  - name: kpi-education-levels
  - name: kpi-formalities
  - name: kpi-genders
  - name: kpi-vocational-educations
  - name: occupation-hierarchy
  - name: industry-hierarchy
  - name: analysis
  - name: occupation-skills
  - name: vacancy-trend
  - name: crawler

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        ThunderID-issued access token. Send as `Authorization: Bearer <token>`.

  parameters:
    fromDateOptional:
      name: from-date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start date, YYYY-MM-DD. If supplied, to-date is also required.
    toDateOptional:
      name: to-date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End date, YYYY-MM-DD. If supplied, from-date is also required.
    fromDateRequired:
      name: from-date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Start date, YYYY-MM-DD.
    toDateRequired:
      name: to-date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: End date, YYYY-MM-DD.
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Numeric ID of the resource.
    standardPath:
      name: standard
      in: path
      required: true
      schema:
        type: string
        enum: [occupation, industry]
      description: Which classification standard this level belongs to.
    levelPath:
      name: level
      in: path
      required: true
      schema:
        type: string
      description: >
        The hierarchy level name. For occupation: major-group, sub-major-group,
        minor-group, unit-group, occupation-group. For industry: industry-sector,
        industry-division, industry-group, industry-class, industry-subclass.
    occupationLevelPath:
      name: level
      in: path
      required: true
      schema:
        type: string
        enum: [major-group, sub-major-group, minor-group, unit-group, occupation-group]
    limitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Max rows to return.
    offsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Rows to skip.

  responses:
    BadRequest:
      description: Invalid request (bad date format, invalid id, invalid standard/level, or to-date before from-date).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A dependency (e.g. the database) is unreachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string

    StatusResponse:
      type: object
      properties:
        status:
          type: string

    # ---- Flat KPI reference tables ----

    EmploymentSector:
      type: object
      properties:
        id: { type: integer }
        sector: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Experience:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EducationLevel:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Formality:
      type: object
      properties:
        id: { type: integer }
        formality_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Gender:
      type: object
      properties:
        id: { type: integer }
        gender_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VocationalEducation:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Hierarchy nodes ----

    HierarchyNode:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }

    HierarchyListResponse:
      type: object
      properties:
        count: { type: integer }
        major_groups:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }

    PaginatedHierarchyListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HierarchyNode' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    # ---- Generic analysis ----

    TotalJobCountResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        total_job_count: { type: integer }

    ChildJobCount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        open_job_count: { type: integer }

    LevelChildrenResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        child_level: { type: string }
        count: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/ChildJobCount' }

    NamedJobCount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    BreakdownResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/NamedJobCount' }

    RemoteOnSiteResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        remote_vs_onsite:
          type: object
          properties:
            remote_count: { type: integer }
            on_site_count: { type: integer }

    # ---- Occupation skills ----

    SkillDemand:
      type: object
      properties:
        id: { type: integer }
        skill: { type: string }
        open_job_count: { type: integer }

    Top15SkillsResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillDemand' }

    AllSkillsResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillDemand' }

    EmployerDemand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    TopHiringEmployersResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        employers:
          type: array
          items: { $ref: '#/components/schemas/EmployerDemand' }

    # ---- National vacancy trend / totals ----

    VacancyTrendPoint:
      type: object
      properties:
        label: { type: string }
        open_job_count: { type: integer }

    VacancyTrendResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        granularity:
          type: string
          enum: [weekly, monthly]
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/VacancyTrendPoint' }

    VacancyTotalResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        total_vacancies: { type: integer }

    DateRangeCountResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/NamedJobCount' }

    # ---- Crawler ----

    CrawlerRun:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    CrawlerRunCreateRequest:
      type: object
      properties:
        status: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    CrawlerRunStatusChangeRequest:
      type: object
      properties:
        status: { type: string }

    CrawlerRunJobReconcileRequest:
      type: object
      properties:
        crawler_run_id: {type: integer}

    JobBatchSave:
      type: object
      properties:
        employer: {type: string}
        job_role: {type: string}
        location: {type: string}
        description: {type: string}
        crawler_run_id: {type: integer}
        source: {type: string}

paths:

  # ============================================================
  # HEALTH
  # ============================================================
  /healthz:
    servers:
      - url: http://localhost:8080
        description: Local development
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }

  /readyz:
    servers:
      - url: http://localhost:8080
        description: Local development
    get:
      tags: [health]
      summary: Readiness probe (checks database connectivity)
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ============================================================
  # KPI: EMPLOYMENT SECTORS
  # ============================================================
  /employment-sectors:
    get:
      tags: [kpi-employment-sectors]
      summary: List employment sectors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmploymentSector' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [kpi-employment-sectors]
      summary: Create an employment sector
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmploymentSector' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentSector' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /employment-sectors/{id}:
    get:
      tags: [kpi-employment-sectors]
      summary: Get an employment sector by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentSector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [kpi-employment-sectors]
      summary: Update an employment sector
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmploymentSector' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentSector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [kpi-employment-sectors]
      summary: Delete (soft-delete) an employment sector
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # KPI: EXPERIENCES
  # ============================================================
  /experiences:
    get:
      tags: [kpi-experiences]
      summary: List experience levels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Experience' }
    post:
      tags: [kpi-experiences]
      summary: Create an experience level
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Experience' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experience' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /experiences/{id}:
    get:
      tags: [kpi-experiences]
      summary: Get an experience level by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experience' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [kpi-experiences]
      summary: Update an experience level
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Experience' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experience' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [kpi-experiences]
      summary: Delete (soft-delete) an experience level
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # KPI: EDUCATION LEVELS
  # ============================================================
  /education-levels:
    get:
      tags: [kpi-education-levels]
      summary: List education levels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EducationLevel' }
    post:
      tags: [kpi-education-levels]
      summary: Create an education level
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EducationLevel' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationLevel' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /education-levels/{id}:
    get:
      tags: [kpi-education-levels]
      summary: Get an education level by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationLevel' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [kpi-education-levels]
      summary: Update an education level
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EducationLevel' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EducationLevel' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [kpi-education-levels]
      summary: Delete (soft-delete) an education level
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # KPI: FORMALITIES
  # ============================================================
  /formalities:
    get:
      tags: [kpi-formalities]
      summary: List formality categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Formality' }
    post:
      tags: [kpi-formalities]
      summary: Create a formality category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Formality' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Formality' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /formalities/{id}:
    get:
      tags: [kpi-formalities]
      summary: Get a formality category by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Formality' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [kpi-formalities]
      summary: Update a formality category
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Formality' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Formality' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [kpi-formalities]
      summary: Delete (soft-delete) a formality category
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # KPI: GENDERS
  # ============================================================
  /genders:
    get:
      tags: [kpi-genders]
      summary: List gender categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Gender' }
    post:
      tags: [kpi-genders]
      summary: Create a gender category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Gender' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gender' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /genders/{id}:
    get:
      tags: [kpi-genders]
      summary: Get a gender category by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gender' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [kpi-genders]
      summary: Update a gender category
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Gender' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gender' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [kpi-genders]
      summary: Delete (soft-delete) a gender category
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # KPI: VOCATIONAL EDUCATIONS
  # ============================================================
  /vocational-educations:
    get:
      tags: [kpi-vocational-educations]
      summary: List vocational education (NVQ) levels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VocationalEducation' }
    post:
      tags: [kpi-vocational-educations]
      summary: Create a vocational education level
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VocationalEducation' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocationalEducation' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /vocational-educations/{id}:
    get:
      tags: [kpi-vocational-educations]
      summary: Get a vocational education level by id
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocationalEducation' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [kpi-vocational-educations]
      summary: Update a vocational education level
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VocationalEducation' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocationalEducation' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [kpi-vocational-educations]
      summary: Delete (soft-delete) a vocational education level
      security:
        - BearerAuth: []
      parameters: [{ $ref: '#/components/parameters/idPath' }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # OCCUPATION HIERARCHY (SLSCO)
  # ============================================================
  /major-groups:
    get:

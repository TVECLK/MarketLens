openapi: 3.0.3
info:
  title: Labour Market Analysis Project - Backend API
  description: |
    National labour market demand for Sri Lanka.

    ## Resource groups
    - **Health** - liveness and readiness probes (unversioned, outside `/api/v1`).
    - **KPI reference tables** - employment sectors, experience, education, formality, gender and vocational education (NVQ) lookups.
    - **Classification hierarchies** - the occupation (SLSCO) and industry (SLSIC) hierarchies, five levels each.
    - **Sources** - the job sources (crawled or manually entered) that jobs are attributed to.
    - **Analysis** - generic level-scoped analysis, occupation skills and hiring employers, national vacancy trend and totals, dashboard card numbers.
    - **Crawler** - crawler run lifecycle, batch ingestion of raw jobs, stale-vacancy reconciliation and the crawler's source list.

    ## Conventions
    - Base path `/api/v1`. Bodies are `application/json`; field names are `snake_case`; timestamps are RFC 3339; dates are `YYYY-MM-DD`.
    - **Authentication.** Reads of the KPI, hierarchy and analysis endpoints are public. Every write, and everything under `/sources` and `/crawler`, needs a ThunderID-issued bearer token carrying the scope named in the operation's `x-required-scope`. Scopes follow `<resource>:<action>` (`create`, `update`, `delete`, `read`).
    - **List responses** are wrapped in an object: `{ "count": n, "<plural>": [...] }`. Paginated lists also return `total`, `limit` and `offset`.
    - **Pagination.** `limit` and `offset` are never rejected - out-of-range values fall back to the effective page settings: the effective `limit` is 20 when absent, non-positive or non-numeric (5 for top hiring employers) and is capped at 100; a negative or non-numeric `offset` is treated as 0. Paginated responses echo the effective `limit` and `offset`. The input schemas therefore carry no `minimum`/`maximum`, so schema-validating clients and gateways do not reject values the server would accept; typed clients can only send integers, while the non-numeric fallback applies to hand-built query strings.
    - **Date ranges.** `from-date`/`to-date` are inclusive; `to-date` must not be before `from-date`. Analysis endpoints require both. Where they are optional (listing the root levels and the children of a parent) supplying one without the other is a 400.
    - **Errors.** Every error body of the `/api/v1` endpoints is `{ "error": "<message>" }`. 400 invalid input; 401 missing/invalid token; 403 token lacks the scope; 404 unknown id; 409 unique-constraint conflict; 500 unexpected failure; 503 a dependency (database or the identity provider) is temporarily unavailable and the request may be retried. 500 and 503 can occur on every `/api/v1` endpoint. **Exception - health probes:** `/healthz` and `/readyz` are outside `/api/v1` and never return the standard error body or a 500; a failing `/readyz` returns 503 with a `StatusResponse` body (`{ "status": "not ready", "message": "database unreachable" }`), which clients must handle separately from the standard error shape.
    - **Soft deletes.** DELETE soft-deletes. Deleting a node of a classification hierarchy also soft-deletes every descendant in the lower levels.
  version: "1.0.0"
  contact:
    name: TVEC
    url: https://github.com/TVECLK/MarketLens
  license:
    name: Apache-2.0
    url: https://github.com/TVECLK/MarketLens#Apache-2.0-1-ov-file

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: health
    description: "Liveness and readiness probes."
  - name: kpi-employment-sectors
    description: "Employment sector reference table."
  - name: kpi-experiences
    description: "Experience level reference table."
  - name: kpi-education-levels
    description: "Education level reference table."
  - name: kpi-formalities
    description: "Formality category reference table."
  - name: kpi-genders
    description: "Gender category reference table."
  - name: kpi-vocational-educations
    description: "Vocational education (NVQ) level reference table."
  - name: occupation-hierarchy
    description: "Occupation classification (SLSCO): major group > sub major group > minor group > unit group > occupation group."
  - name: industry-hierarchy
    description: "Industry classification (SLSIC): industry sector > division > group > class > subclass."
  - name: sources
    description: "Job sources (crawled `auto` or hand-entered `manual`)."
  - name: analysis
    description: "Vacancy analysis scoped to one node of a classification hierarchy."
  - name: occupation-skills
    description: "Skills and hiring employers for an occupation hierarchy node."
  - name: vacancy-trend
    description: "National vacancy trend and totals."
  - name: dashboard
    description: "Headline numbers for the dashboard."
  - name: crawler
    description: "Crawler run lifecycle, ingestion and reconciliation (machine-to-machine)."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        ThunderID-issued access token, sent as `Authorization: Bearer <token>`.
        The scope an operation needs is given by its `x-required-scope` extension.

  parameters:
    fromDateRequired:
      name: from-date
      in: query
      required: true
      schema: { type: string, format: date }
      description: "Start date (inclusive), `YYYY-MM-DD`."
    toDateRequired:
      name: to-date
      in: query
      required: true
      schema: { type: string, format: date }
      description: "End date (inclusive), `YYYY-MM-DD`. Must not be before `from-date`."
    fromDateOptional:
      name: from-date
      in: query
      required: false
      schema: { type: string, format: date }
      description: "Start date (inclusive), `YYYY-MM-DD`. Must be sent together with `to-date`."
    toDateOptional:
      name: to-date
      in: query
      required: false
      schema: { type: string, format: date }
      description: "End date (inclusive), `YYYY-MM-DD`. Must be sent together with `from-date`."
    idPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      description: Numeric id of the resource.
    standardPath:
      name: standard
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Standard" }
      description: Classification standard the level belongs to.
    levelPath:
      name: level
      in: path
      required: true
      schema: { $ref: "#/components/schemas/HierarchyLevel" }
      description: >
        Hierarchy level. Must belong to `standard` - occupation: `major-group`,
        `sub-major-group`, `minor-group`, `unit-group`, `occupation-group`; industry:
        `industry-sector`, `industry-division`, `industry-group`, `industry-class`,
        `industry-subclass`. A mismatch is a 400.
    occupationLevelPath:
      name: level
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OccupationLevel" }
      description: Occupation hierarchy level.
    limitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20 }
      description: >
        Requested page size. The server never rejects it: the effective page size is 20 when
        the value is absent, zero, negative or not a number, and 100 when it is above 100
        (the `limit` echoed in the response is the effective one).
    offsetQuery:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0 }
      description: >
        Number of rows to skip. The server never rejects it: a negative or non-numeric value
        is treated as 0.
    employersLimitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 5 }
      description: >
        Requested number of employers. The server never rejects it: the effective count is 5
        when the value is absent, zero, negative or not a number, and 100 when it is above 100.
    sourceTypeQuery:
      name: type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/SourceType" }
      description: Only return sources of this type. Any other value is a 400.
    isActiveQuery:
      name: is-active
      in: query
      required: false
      schema: { type: boolean }
      description: Only return sources that are (`true`) or are not (`false`) active.

  responses:
    BadRequest:
      description: "Invalid request: malformed JSON or missing/oversized field, invalid id, date or enum value, `to-date` before `from-date`, a non-existent parent id, or a level that does not belong to the standard."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: "Missing, invalid or expired bearer token."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: "The token does not carry the scope the operation requires (`error` names it)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: "No resource with that id (or it has been deleted)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: "The request conflicts with existing data, e.g. the name is already used (`already exists`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: "Unexpected server error."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceUnavailable:
      description: "A dependency (database or identity provider) is temporarily unavailable. Safe to retry."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ---- Common ----

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, example: invalid id parameter }

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string, example: Gender category deleted successfully }

    StatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not ready] }
        message:
          type: string
          description: Only present on a failing readiness check.
          example: database unreachable

    AuditedResource:
      type: object
      description: Fields every stored resource carries.
      properties:
        id: { type: integer, example: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ListEnvelope:
      type: object
      description: Shared by every list response; the items sit under a resource-specific key.
      required: [count]
      properties:
        count: { type: integer, description: Number of items in this response. }

    PaginatedEnvelope:
      type: object
      description: Shared by every paginated list response.
      required: [count, total, limit, offset]
      properties:
        count: { type: integer, description: Number of items in this page. }
        total: { type: integer, description: Total number of items across all pages. }
        limit: { type: integer, description: Page size actually applied. }
        offset: { type: integer, description: Rows skipped. }

    DateRange:
      type: object
      description: The date range the response was computed for, echoed back.
      properties:
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }

    Standard:
      type: string
      enum: [occupation, industry]

    OccupationLevel:
      type: string
      enum: [major-group, sub-major-group, minor-group, unit-group, occupation-group]

    IndustryLevel:
      type: string
      enum: [industry-sector, industry-division, industry-group, industry-class, industry-subclass]

    HierarchyLevel:
      description: Any level of either hierarchy.
      oneOf:
        - $ref: "#/components/schemas/OccupationLevel"
        - $ref: "#/components/schemas/IndustryLevel"

    # ---- KPI reference tables ----
    # Writes are full replacements of the single field, which is required.

    EmploymentSector:
      description: "A employment sector."
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            sector: { type: string }

    EmploymentSectorRequest:
      type: object
      required: [sector]
      properties:
        sector: { type: string, minLength: 1, maxLength: 100 }

    EmploymentSectorListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [employment_sectors]
          properties:
            employment_sectors:
              type: array
              items: { $ref: "#/components/schemas/EmploymentSector" }

    Experience:
      description: "A experience level."
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            name: { type: string }

    ExperienceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    ExperienceListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [experiences]
          properties:
            experiences:
              type: array
              items: { $ref: "#/components/schemas/Experience" }

    EducationLevel:
      description: "A education level."
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            level: { type: string }

    EducationLevelRequest:
      type: object
      required: [level]
      properties:
        level: { type: string, minLength: 1, maxLength: 100 }

    EducationLevelListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [education_levels]
          properties:
            education_levels:
              type: array
              items: { $ref: "#/components/schemas/EducationLevel" }

    Formality:
      description: "A formality category."
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            formality_type: { type: string }

    FormalityRequest:
      type: object
      required: [formality_type]
      properties:
        formality_type: { type: string, minLength: 1, maxLength: 50 }

    FormalityListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [formalities]
          properties:
            formalities:
              type: array
              items: { $ref: "#/components/schemas/Formality" }

    Gender:
      description: "A gender category."
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            gender_type: { type: string }

    GenderRequest:
      type: object
      required: [gender_type]
      properties:
        gender_type: { type: string, minLength: 1, maxLength: 50 }

    GenderListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [genders]
          properties:
            genders:
              type: array
              items: { $ref: "#/components/schemas/Gender" }

    VocationalEducation:
      description: "A vocational education (NVQ) level."
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            level: { type: string }

    VocationalEducationRequest:
      type: object
      required: [level]
      properties:
        level: { type: string, minLength: 1, maxLength: 50 }

    VocationalEducationListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [vocational_educations]
          properties:
            vocational_educations:
              type: array
              items: { $ref: "#/components/schemas/VocationalEducation" }

    # ---- Classification hierarchies ----
    # Occupation: major-group > sub-major-group > minor-group > unit-group > occupation-group
    # Industry:   industry-sector > industry-division > industry-group > industry-class > industry-subclass
    #
    # Every level below the root exists in two shapes:
    # - `<Level>` is returned by that level's GET list and GET by id. One level of parent is
    #   preloaded and always present.
    # - `<Level>Basic` has the parent id but a null parent object. It is returned by create and
    #   update responses and by "children of {id}" lists (none preload the parent), and it is
    #   how a parent appears nested inside its child (only one level is ever preloaded).

    ClassificationFields:
      type: object
      properties:
        name: { type: string }
        code: { type: string }

    ClassificationRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, minLength: 1, maxLength: 50 }

    ClassificationUpdateRequest:
      description: Partial update - send any subset of the fields. A parent id, if sent, must exist.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, minLength: 1, maxLength: 50 }

    MajorGroup:
      description: Top level of its hierarchy - a major group has no parent.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"

    MajorGroupListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [major_groups]
          properties:
            major_groups:
              type: array
              items: { $ref: "#/components/schemas/MajorGroup" }

    SubMajorGroupBasic:
      description: A sub major group without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            major_group_id: { type: integer }
            major_group:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    SubMajorGroup:
      description: A sub major group with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            major_group_id: { type: integer }
            major_group: { $ref: "#/components/schemas/MajorGroup" }

    SubMajorGroupRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [major_group_id]
          properties:
            major_group_id: { type: integer, minimum: 1 }

    SubMajorGroupUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            major_group_id: { type: integer, minimum: 1 }

    SubMajorGroupListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [sub_major_groups]
          properties:
            sub_major_groups:
              type: array
              items: { $ref: "#/components/schemas/SubMajorGroup" }

    SubMajorGroupByParentResponse:
      description: The sub major groups under one major group.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [major_group_id, sub_major_groups]
          properties:
            major_group_id: { type: integer }
            sub_major_groups:
              type: array
              items: { $ref: "#/components/schemas/SubMajorGroupBasic" }

    MinorGroupBasic:
      description: A minor group without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            sub_major_group_id: { type: integer }
            sub_major_group:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    MinorGroup:
      description: A minor group with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            sub_major_group_id: { type: integer }
            sub_major_group: { $ref: "#/components/schemas/SubMajorGroupBasic" }

    MinorGroupRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [sub_major_group_id]
          properties:
            sub_major_group_id: { type: integer, minimum: 1 }

    MinorGroupUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            sub_major_group_id: { type: integer, minimum: 1 }

    MinorGroupListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [minor_groups]
          properties:
            minor_groups:
              type: array
              items: { $ref: "#/components/schemas/MinorGroup" }

    MinorGroupByParentResponse:
      description: The minor groups under one sub major group.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [sub_major_group_id, minor_groups]
          properties:
            sub_major_group_id: { type: integer }
            minor_groups:
              type: array
              items: { $ref: "#/components/schemas/MinorGroupBasic" }

    UnitGroupBasic:
      description: A unit group without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            minor_group_id: { type: integer }
            minor_group:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    UnitGroup:
      description: A unit group with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            minor_group_id: { type: integer }
            minor_group: { $ref: "#/components/schemas/MinorGroupBasic" }

    UnitGroupRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [minor_group_id]
          properties:
            minor_group_id: { type: integer, minimum: 1 }

    UnitGroupUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            minor_group_id: { type: integer, minimum: 1 }

    UnitGroupListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [unit_groups]
          properties:
            unit_groups:
              type: array
              items: { $ref: "#/components/schemas/UnitGroup" }

    UnitGroupByParentResponse:
      description: The unit groups under one minor group.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [minor_group_id, unit_groups]
          properties:
            minor_group_id: { type: integer }
            unit_groups:
              type: array
              items: { $ref: "#/components/schemas/UnitGroupBasic" }

    OccupationGroupBasic:
      description: A occupation group without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            unit_group_id: { type: integer }
            unit_group:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    OccupationGroup:
      description: A occupation group with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            unit_group_id: { type: integer }
            unit_group: { $ref: "#/components/schemas/UnitGroupBasic" }

    OccupationGroupRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [unit_group_id]
          properties:
            unit_group_id: { type: integer, minimum: 1 }

    OccupationGroupUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            unit_group_id: { type: integer, minimum: 1 }

    OccupationGroupPaginatedResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedEnvelope"
        - type: object
          required: [occupation_groups]
          properties:
            occupation_groups:
              type: array
              items: { $ref: "#/components/schemas/OccupationGroup" }

    OccupationGroupByParentResponse:
      description: The occupation groups under one unit group.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [unit_group_id, occupation_groups]
          properties:
            unit_group_id: { type: integer }
            occupation_groups:
              type: array
              items: { $ref: "#/components/schemas/OccupationGroupBasic" }

    IndustrySector:
      description: Top level of its hierarchy - a industry sector has no parent.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"

    IndustrySectorListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_sectors]
          properties:
            industry_sectors:
              type: array
              items: { $ref: "#/components/schemas/IndustrySector" }

    IndustryDivisionBasic:
      description: A industry division without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_sector_id: { type: integer }
            industry_sector:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    IndustryDivision:
      description: A industry division with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_sector_id: { type: integer }
            industry_sector: { $ref: "#/components/schemas/IndustrySector" }

    IndustryDivisionRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [industry_sector_id]
          properties:
            industry_sector_id: { type: integer, minimum: 1 }

    IndustryDivisionUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            industry_sector_id: { type: integer, minimum: 1 }

    IndustryDivisionListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_divisions]
          properties:
            industry_divisions:
              type: array
              items: { $ref: "#/components/schemas/IndustryDivision" }

    IndustryDivisionByParentResponse:
      description: The industry divisions under one industry sector.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_sector_id, industry_divisions]
          properties:
            industry_sector_id: { type: integer }
            industry_divisions:
              type: array
              items: { $ref: "#/components/schemas/IndustryDivisionBasic" }

    IndustryGroupBasic:
      description: A industry group without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_division_id: { type: integer }
            industry_division:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    IndustryGroup:
      description: A industry group with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_division_id: { type: integer }
            industry_division: { $ref: "#/components/schemas/IndustryDivisionBasic" }

    IndustryGroupRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [industry_division_id]
          properties:
            industry_division_id: { type: integer, minimum: 1 }

    IndustryGroupUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            industry_division_id: { type: integer, minimum: 1 }

    IndustryGroupListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_groups]
          properties:
            industry_groups:
              type: array
              items: { $ref: "#/components/schemas/IndustryGroup" }

    IndustryGroupByParentResponse:
      description: The industry groups under one industry division.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_division_id, industry_groups]
          properties:
            industry_division_id: { type: integer }
            industry_groups:
              type: array
              items: { $ref: "#/components/schemas/IndustryGroupBasic" }

    IndustryClassBasic:
      description: A industry class without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_group_id: { type: integer }
            industry_group:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    IndustryClass:
      description: A industry class with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_group_id: { type: integer }
            industry_group: { $ref: "#/components/schemas/IndustryGroupBasic" }

    IndustryClassRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [industry_group_id]
          properties:
            industry_group_id: { type: integer, minimum: 1 }

    IndustryClassUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            industry_group_id: { type: integer, minimum: 1 }

    IndustryClassListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_classes]
          properties:
            industry_classes:
              type: array
              items: { $ref: "#/components/schemas/IndustryClass" }

    IndustryClassByParentResponse:
      description: The industry classes under one industry group.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_group_id, industry_classes]
          properties:
            industry_group_id: { type: integer }
            industry_classes:
              type: array
              items: { $ref: "#/components/schemas/IndustryClassBasic" }

    IndustrySubclassBasic:
      description: A industry subclass without its parent object. Returned by create/update and by the children-of-parent list.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_class_id: { type: integer }
            industry_class:
              type: object
              nullable: true
              description: Always null here - the parent is not preloaded.

    IndustrySubclass:
      description: A industry subclass with its parent. Returned by GET list and GET by id.
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - $ref: "#/components/schemas/ClassificationFields"
        - type: object
          properties:
            industry_class_id: { type: integer }
            industry_class: { $ref: "#/components/schemas/IndustryClassBasic" }

    IndustrySubclassRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationRequest"
        - type: object
          required: [industry_class_id]
          properties:
            industry_class_id: { type: integer, minimum: 1 }

    IndustrySubclassUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClassificationUpdateRequest"
        - type: object
          properties:
            industry_class_id: { type: integer, minimum: 1 }

    IndustrySubclassPaginatedResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedEnvelope"
        - type: object
          required: [industry_subclasses]
          properties:
            industry_subclasses:
              type: array
              items: { $ref: "#/components/schemas/IndustrySubclass" }

    IndustrySubclassByParentResponse:
      description: The industry subclasses under one industry class.
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [industry_class_id, industry_subclasses]
          properties:
            industry_class_id: { type: integer }
            industry_subclasses:
              type: array
              items: { $ref: "#/components/schemas/IndustrySubclassBasic" }

    # ---- Analysis ----

    LevelContext:
      description: The node (and date range) an analysis response was computed for.
      allOf:
        - $ref: "#/components/schemas/DateRange"
        - type: object
          properties:
            level: { type: string, example: major-group }
            id: { type: integer, example: 1 }

    StandardLevelContext:
      allOf:
        - $ref: "#/components/schemas/LevelContext"
        - type: object
          properties:
            standard: { $ref: "#/components/schemas/Standard" }

    JobCount:
      type: object
      properties:
        id: { type: integer }
        open_job_count: { type: integer, description: Open vacancies matching the node and date range. }

    TotalJobCountResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - type: object
          properties:
            total_job_count: { type: integer }

    ChildJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - $ref: "#/components/schemas/ClassificationFields"

    LevelChildrenResponse:
      description: The immediate children of a node, each with its job count.
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [children]
          properties:
            child_level: { type: string, example: sub-major-group }
            children:
              type: array
              items: { $ref: "#/components/schemas/ChildJobCount" }

    EmploymentSectorJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            sector: { type: string }

    EmploymentSectorBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [employment_sectors]
          properties:
            employment_sectors:
              type: array
              items: { $ref: "#/components/schemas/EmploymentSectorJobCount" }

    ExperienceJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            name: { type: string }

    ExperienceBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [experiences]
          properties:
            experiences:
              type: array
              items: { $ref: "#/components/schemas/ExperienceJobCount" }

    EducationLevelJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            level: { type: string }

    EducationLevelBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [education_levels]
          properties:
            education_levels:
              type: array
              items: { $ref: "#/components/schemas/EducationLevelJobCount" }

    FormalityJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            formality_type: { type: string }

    FormalityBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [formalities]
          properties:
            formalities:
              type: array
              items: { $ref: "#/components/schemas/FormalityJobCount" }

    GenderJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            gender_type: { type: string }

    GenderBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [genders]
          properties:
            genders:
              type: array
              items: { $ref: "#/components/schemas/GenderJobCount" }

    VocationalEducationJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            level: { type: string }

    VocationalEducationBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [vocational_educations]
          properties:
            vocational_educations:
              type: array
              items: { $ref: "#/components/schemas/VocationalEducationJobCount" }

    JobTypeJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            type: { type: string }

    JobTypeBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [job_types]
          properties:
            job_types:
              type: array
              items: { $ref: "#/components/schemas/JobTypeJobCount" }

    ProvinceJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            province: { type: string }
            lat: { type: number, format: double }
            lng: { type: number, format: double }

    ProvinceBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [provinces]
          properties:
            provinces:
              type: array
              items: { $ref: "#/components/schemas/ProvinceJobCount" }

    WorkModeCounts:
      type: object
      properties:
        remote_count: { type: integer }
        on_site_count: { type: integer }
        hybrid_count: { type: integer }

    WorkModeBreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/StandardLevelContext"
        - type: object
          properties:
            remote_vs_onsite_vs_hybrid: { $ref: "#/components/schemas/WorkModeCounts" }

    # ---- Occupation skills / employers ----

    SkillDemand:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            skill: { type: string }

    SkillsResponse:
      allOf:
        - $ref: "#/components/schemas/LevelContext"
        - $ref: "#/components/schemas/PaginatedEnvelope"
        - type: object
          required: [skills]
          properties:
            skills:
              type: array
              items: { $ref: "#/components/schemas/SkillDemand" }

    EmployerDemand:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            name: { type: string }

    TopHiringEmployersResponse:
      allOf:
        - $ref: "#/components/schemas/LevelContext"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [employers]
          properties:
            employers:
              type: array
              items: { $ref: "#/components/schemas/EmployerDemand" }

    # ---- National vacancy trend / totals / dashboard ----

    VacancyTrendPoint:
      type: object
      properties:
        label:
          type: string
          description: Bucket label - a day (`Jan 2`) for daily granularity, a month (`Jan 2006`) for monthly.
          example: Jan 2
        open_job_count: { type: integer }

    VacancyTrendResponse:
      allOf:
        - $ref: "#/components/schemas/DateRange"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [data]
          properties:
            granularity:
              type: string
              enum: [daily, monthly]
              description: "`daily` when the range is shorter than 60 days, `monthly` otherwise."
            data:
              type: array
              items: { $ref: "#/components/schemas/VacancyTrendPoint" }

    VacancyTotalResponse:
      allOf:
        - $ref: "#/components/schemas/DateRange"
        - type: object
          properties:
            total_vacancies: { type: integer }

    RootJobCount:
      allOf:
        - $ref: "#/components/schemas/JobCount"
        - type: object
          properties:
            name: { type: string }

    JobCountByDateRangeResponse:
      description: >
        Vacancy counts grouped by the root level of the standard (major group for
        occupation, industry sector for industry).
      allOf:
        - $ref: "#/components/schemas/DateRange"
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [data]
          properties:
            standard: { $ref: "#/components/schemas/Standard" }
            data:
              type: array
              items: { $ref: "#/components/schemas/RootJobCount" }

    DashboardCardDataResponse:
      description: All-time headline numbers for the dashboard cards (not date-range filtered).
      type: object
      properties:
        source_count: { type: integer, description: Number of (non-deleted) sources., example: 4 }
        all_time_vacancy_count:
          type: integer
          description: Sum of `no_of_vacancies` across every job post.
          example: 18250
        industry_count: { type: integer, description: Number of industry sectors., example: 21 }

    # ---- Sources ----

    SourceType:
      type: string
      enum: [auto, manual]
      description: "`auto` sources are collected by a crawler; `manual` ones are entered by hand (e.g. newspaper ads)."

    Source:
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            name: { type: string, example: ikman.lk }
            type: { $ref: "#/components/schemas/SourceType" }
            is_active: { type: boolean }

    SourceListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          required: [sources]
          properties:
            sources:
              type: array
              items: { $ref: "#/components/schemas/Source" }

    SourceCreateRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        type: { $ref: "#/components/schemas/SourceType" }
        is_active: { type: boolean, default: true, description: Optional; defaults to active. }

    SourceRenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    SourceStatusUpdateRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }

    # ---- Crawler ----

    CrawlerRunStatus:
      type: string
      enum: [RUNNING, COMPLETED, FAILED]

    CrawlerRun:
      allOf:
        - $ref: "#/components/schemas/AuditedResource"
        - type: object
          properties:
            started_at: { type: string, format: date-time, nullable: true }
            finished_at: { type: string, format: date-time, nullable: true }
            status: { $ref: "#/components/schemas/CrawlerRunStatus" }

    CrawlerRunStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [COMPLETED, FAILED]

    CrawlerRunJobReconcileRequest:
      type: object
      required: [crawler_run_id, sources]
      properties:
        crawler_run_id: { type: integer, minimum: 1 }
        sources:
          type: array
          minItems: 1
          description: >
            Names of the sources this run crawled. Only open jobs of these sources - and only
            while the source is active and not deleted - are reconciled.
          items: { type: string }

    ReconcileResponse:
      type: object
      properties:
        message: { type: string, example: System-wide stale vacancy cleanup sweep finalized }
        reconciled_stale_jobs: { type: integer, description: Number of jobs that were closed. }

    BatchSaveJobInput:
      type: object
      description: >
        One raw job posted by the crawler. The HTTP layer validates none of the fields; a job
        that cannot be processed is reported back in `failed_jobs`.
      properties:
        job_id:
          type: string
          description: Crawler-side job identifier, echoed back in `failed_jobs`.
          example: 3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b
        employer: { type: string }
        job_role: { type: string }
        location: { type: string }
        description: { type: string }
        crawler_run_id:
          type: integer
          description: Id of the RUNNING crawler run that produced the job. Required in practice.
        source:
          type: string
          description: Name of a registered, active source (e.g. `ikman.lk`). Required in practice.

    BatchSavePayload:
      description: >
        A non-empty JSON array of raw jobs (the body is the array itself, not an object). Every
        element must decode: one wrongly typed field rejects the whole batch with 400.
      type: array
      minItems: 1
      items: { $ref: "#/components/schemas/BatchSaveJobInput" }

    FailedJob:
      type: object
      required: [job_id, status_code, error]
      properties:
        job_id: { type: string, example: 22222222-2222-2222-2222-222222222222 }
        status_code:
          type: integer
          enum: [400, 422, 503]
          description: >
            Why the job failed. `400`: not enough usable text, no `crawler_run_id` or no `source`.
            `422`: permanent failure - the crawler run does not exist or is not RUNNING, the
            source is unregistered or disabled, or extraction/validation failed; do not retry.
            `503`: transient dependency failure; safe to retry.
          example: 503
        error:
          type: string
          example: 'job "Store Manager" at "Lanka Retail Group": transient extraction failure: deepseek returned status 429'

    BatchSaveResponse:
      type: object
      required: [message, submitted, failed_count, failed_jobs]
      properties:
        message: { type: string, example: Batch processed }
        submitted:
          type: integer
          description: Number of jobs in the submitted batch, failed ones included.
          example: 2
        failed_count: { type: integer, example: 1 }
        failed_jobs:
          type: array
          description: One entry per job that failed. Empty if every job was saved (or was a duplicate of an existing job).
          items: { $ref: "#/components/schemas/FailedJob" }


paths:
  # ============================================================
  # HEALTH
  # ============================================================
  /healthz:
    servers:
      - url: http://localhost:8080
        description: Local development (unversioned)
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Confirms the process is up. Does not touch the database.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /readyz:
    servers:
      - url: http://localhost:8080
        description: Local development (unversioned)
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: Checks database connectivity.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "503":
          description: "Database unreachable. Unlike every other endpoint the body is a `StatusResponse` (`status` is `not ready`), not the standard `{ \"error\": ... }` error body."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  # ============================================================
  # KPI: EMPLOYMENT SECTORS
  # ============================================================
  /employment-sectors:
    get:
      tags: [kpi-employment-sectors]
      operationId: listEmploymentSectors
      summary: "List employment sectors"
      security: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmploymentSectorListResponse" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [kpi-employment-sectors]
      operationId: createEmploymentSector
      summary: "Create a employment sector"
      x-required-scope: employment-sectors:create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmploymentSectorRequest" }
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmploymentSector" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /employment-sectors/{id}:
    parameters:
      - { $ref: "#/components/parameters/idPath" }
    get:
      tags: [kpi-employment-sectors]
      operationId: getEmploymentSector
      summary: "Get a employment sector by id"
      security: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmploymentSector" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [kpi-employment-sectors]
      operationId: updateEmploymentSector
      summary: "Update a employment sector"
      description: >
        Full replacement - `sector` is required.
      x-required-scope: employment-sectors:update
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmploymentSectorRequest" }
      responses:
        "200":
          description: "Updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmploymentSector" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [kpi-employment-sectors]
      operationId: deleteEmploymentSector
      summary: "Delete (soft-delete) a employment sector"
      x-required-scope: employment-sectors:delete
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "Deleted"
          content:
            application/json:

  # ============================================================
  # CRAWLER RUN MONITORING
  # ============================================================
  /crawler/runs:
    post:
      tags: [crawler]
      summary: Start new crawler run session
      description: Takes no request body - the server creates the run and assigns it an id.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlerRun' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /crawler/runs/{id}/complete:
    post:
      tags: [crawler]
      summary: Update crawler status
      security:
        - BearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/idPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlerRunStatusChangeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /crawler/jobs/batch-save:
    post:
      tags: [crawler]
      summary: Send raw jobs from the crawler to backend to save in database
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchSavePayload' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchSaveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /crawler/jobs/reconcile:
    post:
      tags: [crawler]
      summary: Update all jobs end_date that is not equal to current crawler_run_id and end_date is equal to null, to an actual date
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlerRunJobReconcileRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
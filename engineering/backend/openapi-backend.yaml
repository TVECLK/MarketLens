    OccupationGroup:
      description: Returned by GET /occupation-groups and GET /occupation-groups/{id}.
      type: object
      properties:
        id: { type: integer }
        unit_group_id: { type: integer }
        unit_group: { $ref: '#/components/schemas/UnitGroupBasic' }
        name: { type: string }
        code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OccupationGroupRequest:

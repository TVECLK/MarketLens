        type: { type: string }
        open_job_count: { type: integer }

    JobTypeBreakdownResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        job_types:
          type: array
          items: { $ref: "#/components/schemas/JobTypeJobCount" }

    RemoteOnSiteHybridResponse:
      type: object

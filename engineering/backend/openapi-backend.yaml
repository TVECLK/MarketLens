openapi: 3.0.3
info:
  title: Labour Market Analysis Project - Backend
  description: >
    National labour market demand for Sri Lanka.
    Endpoints are grouped into: health checks, flat KPI reference tables,
    the occupation (SLSCO) and industry (SLSIC) classification hierarchies,
    generic level-scoped analysis, occupation skills/employer analysis,
    national vacancy trend and totals and crawler run monitoring.
  version: "1.0.0"
  contact:
    name: TVEC
    url: https://github.com/TVECLK/MarketLens
  license:
    name: Apache-2.0
    url: https://github.com/TVECLK/MarketLens#Apache-2.0-1-ov-file

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: health
  - name: kpi-employment-sectors
  - name: kpi-experiences
  - name: kpi-education-levels
  - name: kpi-formalities
  - name: kpi-genders
  - name: kpi-vocational-educations
  - name: occupation-hierarchy
  - name: industry-hierarchy
  - name: analysis
  - name: occupation-skills
  - name: vacancy-trend
  - name: crawler

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        ThunderID-issued access token. Send as `Authorization: Bearer <token>`.

  parameters:
    fromDateOptional:
      name: from-date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start date, YYYY-MM-DD. If supplied, to-date is also required.
    toDateOptional:
      name: to-date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End date, YYYY-MM-DD. If supplied, from-date is also required.
    fromDateRequired:
      name: from-date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Start date, YYYY-MM-DD.
    toDateRequired:
      name: to-date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: End date, YYYY-MM-DD.
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Numeric ID of the resource.
    standardPath:
      name: standard
      in: path
      required: true
      schema:
        type: string
        enum: [occupation, industry]
      description: Which classification standard this level belongs to.
    levelPath:
      name: level
      in: path
      required: true
      schema:
        type: string
      description: >
        The hierarchy level name. For occupation: major-group, sub-major-group,
        minor-group, unit-group, occupation-group. For industry: industry-sector,
        industry-division, industry-group, industry-class, industry-subclass.
    occupationLevelPath:
      name: level
      in: path
      required: true
      schema:
        type: string
        enum:
          [
            major-group,
            sub-major-group,
            minor-group,
            unit-group,
            occupation-group,
          ]
    limitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Max rows to return (default 20, capped at 100).
    offsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Rows to skip.

  responses:
    BadRequest:
      description: Invalid request (bad date format, invalid id, invalid standard/level, or to-date before from-date).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Token lacks the required scope (e.g. `crawler:runs`, `genders:create`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A dependency (e.g. the database) is unreachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    StatusResponse:
      type: object
      properties:
        status: { type: string }
        message:
          type: string
          description: Only present on a failing readiness check.

    # ---- Flat KPI reference tables ----
    # List endpoints wrap their array in {count, <plural-key>}, not a bare array.

    EmploymentSectorResponse:
      type: object
      properties:
        id: { type: integer }
        sector: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EmploymentSectorRequest:
      type: object
      required: [sector]
      properties:
        sector: { type: string, maxLength: 100 }

    EmploymentSectorListResponse:
      type: object
      properties:
        count: { type: integer }
        employment_sectors:
          type: array
          items: { $ref: "#/components/schemas/EmploymentSectorResponse" }

    ExperienceResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExperienceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }

    ExperienceListResponse:
      type: object
      properties:
        count: { type: integer }
        experiences:
          type: array
          items: { $ref: "#/components/schemas/ExperienceResponse" }

    EducationLevelResponse:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EducationLevelRequest:
      type: object
      required: [level]
      properties:
        level: { type: string, maxLength: 100 }

    EducationLevelListResponse:
      type: object
      properties:
        count: { type: integer }
        education_levels:
          type: array
          items: { $ref: "#/components/schemas/EducationLevelResponse" }

    FormalityResponse:
      type: object
      properties:
        id: { type: integer }
        formality_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FormalityRequest:
      type: object
      required: [formality_type]
      properties:
        formality_type: { type: string, maxLength: 50 }

    FormalityListResponse:
      type: object
      properties:
        count: { type: integer }
        formalities:
          type: array
          items: { $ref: "#/components/schemas/FormalityResponse" }

    GenderResponse:
      type: object
      properties:
        id: { type: integer }
        gender_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GenderRequest:
      type: object
      required: [gender_type]
      properties:
        gender_type: { type: string, maxLength: 50 }

    GenderListResponse:
      type: object
      properties:
        count: { type: integer }
        genders:
          type: array
          items: { $ref: "#/components/schemas/GenderResponse" }

    VocationalEducationResponse:
      type: object
      properties:
        id: { type: integer }
        level: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VocationalEducationRequest:
      type: object
      required: [level]
      properties:
        level: { type: string, maxLength: 50 }

    VocationalEducationListResponse:
      type: object
      properties:
        count: { type: integer }
        vocational_educations:
          type: array
          items: { $ref: "#/components/schemas/VocationalEducationResponse" }

    # ---- Hierarchy nodes ----
    # Occupation hierarchy: major-group -> sub-major-group -> minor-group -> unit-group -> occupation-group
    # Industry hierarchy: industry-sector -> industry-division -> industry-group -> industry-class -> industry-subclass
    # Every level below the top of its hierarchy carries its parent's id plus the preloaded parent
    # object; the parent object is null on endpoints that list children by parent id (not preloaded there).

    HierarchyNode:
      description: Top-of-hierarchy node (major-group / industry-sector) - has no parent.
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HierarchyNodeRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 50 }

    HierarchyNodeUpdateRequest:
      description: Partial update - any subset of fields may be sent (a parent id, if sent, must exist).
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 50 }

    # Each level below the top has two response shapes instead of one nullable field:
    # - the plain name (e.g. SubMajorGroup) is returned by its own GET list / GET by id,
    #   where the backend preloads exactly one level of parent and it is always present.
    # - the "Basic" variant (e.g. SubMajorGroupBasic) has no parent field at all. It is
    #   returned by that resource's create/update responses and by "list children of
    #   {parentId}" endpoints (none of which preload the parent), and it is also what
    #   shows up nested one level further up (GORM preloads only a single relation deep,
    #   so a populated parent's own parent is never included).

    SubMajorGroupBasic:
      description: Returned by create/update and by GET /major-groups/{id}/sub-major-groups.
      type: object
      properties:
        id: { type: integer }
        major_group_id: { type: integer }
        major_group:
          nullable: true
          enum: [null]
          description: Always null in this response - the parent is not preloaded here.
        name: { type: string }
        code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SubMajorGroup:
      description: Returned by GET /sub-major-groups and GET /sub-major-groups/{id}.
      type: object
      properties:
        id: { type: integer }
        major_group_id: { type: integer }
        major_group: { $ref: "#/components/schemas/HierarchyNode" }
        name: { type: string }
        code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SubMajorGroupRequest:
      type: object
      required: [major_group_id, name, code]
      properties:
        major_group_id: { type: integer }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 50 }

    SubMajorGroupUpdateRequest:
      description: Partial update - any subset of fields may be sent (a parent id, if sent, must exist).
      type: object
      properties:
        major_group_id: { type: integer }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 50 }

    SubMajorGroupListResponse:
      type: object
      properties:
        count: { type: integer }
        sub_major_groups:
          type: array
          items: { $ref: "#/components/schemas/SubMajorGroup" }

    MinorGroupBasic:
      description: Returned by create/update and by GET /sub-major-groups/{id}/minor-groups.
      type: object
      properties:
        id: { type: integer }

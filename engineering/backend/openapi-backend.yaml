  # ============================================================
  # CRAWLER RUN MONITORING
  # ============================================================
  /crawler/runs:
    post:
      tags: [crawler]
      summary: Start new crawler run session
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlerRunCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlerRun' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /crawler/runs/{id}/complete:
    post:
      tags: [crawler]
      summary: Update crawler status
      security:
        - BearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/idPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlerRun' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /crawler/jobs/batch-save:
    post:
      tags: [crawler]
      summary: Send raw jobs from the crawler to backend to save in database
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JobBatchSave'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Jobs saved successfully
        '400': { $ref: '#/components/responses/BadRequest' }

  /crawler/jobs/reconcile:
    post:
      tags: [crawler]
      summary: Update all jobs end_date that is not equal to current crawler_run_id and end_date is equal to null, to an actual date
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                crawler_run_id:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Updated saved successfully
        '400': { $ref: '#/components/responses/BadRequest' }
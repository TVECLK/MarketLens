        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        job_types:
          type: array
          items: { $ref: '#/components/schemas/JobTypeJobCount' }

    RemoteOnSiteHybridResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        remote_vs_onsite_vs_hybrid:
          type: object
          properties:
            remote_count: { type: integer }
            on_site_count: { type: integer }
            hybrid_count: { type: integer }

    # ---- Occupation skills ----

    SkillDemand:
      type: object
      properties:
        id: { type: integer }
        skill: { type: string }
        open_job_count: { type: integer }

    Top15SkillsResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillDemand' }

    AllSkillsResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillDemand' }

    EmployerDemand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    TopHiringEmployersResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        employers:
          type: array
          items: { $ref: '#/components/schemas/EmployerDemand' }

    # ---- National vacancy trend / totals ----

    VacancyTrendPoint:
      type: object
      properties:
        label: { type: string }
        open_job_count: { type: integer }

    VacancyTrendResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        granularity:
          type: string
          enum: [weekly, monthly]
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/VacancyTrendPoint' }

    VacancyTotalResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        total_vacancies: { type: integer }

    OccupationDateRangeCountResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        occupations:
          type: array
          items: { $ref: '#/components/schemas/NamedJobCount' }

    IndustryDateRangeCountResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        industries:
          type: array
          items: { $ref: '#/components/schemas/NamedJobCount' }

    # ---- Crawler ----
    # Starting a run takes no request body; completing one only flips its status.

    CrawlerRun:
      type: object
      properties:
        id: { type: integer }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CrawlerRunStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: "'COMPLETED' or 'FAILED'"

    CrawlerRunJobReconcileRequest:
      type: object
      required: [crawler_run_id]
      properties:
        crawler_run_id: { type: integer }

    ReconcileResponse:
      type: object
      properties:
        message: { type: string }
        reconciled_stale_jobs: { type: integer }

    JobMetaDataInput:
      type: object
      description: Mirrors meta_data on job_post; all foreign keys are optional.
      properties:
        ai_version_id: { type: integer, nullable: true }
        education_level_id: { type: integer, nullable: true }
        crawler_run_id: { type: integer, nullable: true }
        geo_data_id: { type: integer, nullable: true }
        source_id: { type: integer, nullable: true }
        experience_id: { type: integer, nullable: true }
        occupation_group_id: { type: integer, nullable: true }
        industry_subclass_id: { type: integer, nullable: true }
        formality_id: { type: integer, nullable: true }
        gender_id: { type: integer, nullable: true }
        vocational_education_id: { type: integer, nullable: true }
        employment_sector_id: { type: integer, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        minhash_signature:
          type: array
          items: { type: integer }
        confidence_score: { type: number, format: double }

    JobPostInput:
      type: object
      properties:
        employer_id: { type: integer, nullable: true }
        job_type_id: { type: integer, nullable: true }
        job_role: { type: string }
        work_mode:
          type: string
          enum: [remote, onsite, hybrid]
        job_description: { type: string }
        location: { type: string }
        no_of_vacancies: { type: integer }
        meta_data: { $ref: '#/components/schemas/JobMetaDataInput' }
        skills:
          type: array
          items:
            type: object
            properties:
              skill: { type: string }

    LshIndexInput:
      type: object
      properties:
        bucket_key: { type: string }
        band_no: { type: integer }
        job_post_id: { type: integer }

    BatchSavePayload:
      type: object
      required: [new_jobs, lsh_indexes]
      properties:
        new_jobs:
          type: array
          items: { $ref: '#/components/schemas/JobPostInput' }
        lsh_indexes:
          type: array
          items: { $ref: '#/components/schemas/LshIndexInput' }

    BatchSaveResponse:
      type: object
      properties:
        message: { type: string, example: Successfully persisted unique job block chunk }
        inserted_records: { type: integer }


    # ---- Generic analysis ----

    TotalJobCountResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        total_job_count: { type: integer }

    ChildJobCount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        open_job_count: { type: integer }

    LevelChildrenResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        child_level: { type: string }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/ChildJobCount" }

    EmploymentSectorJobCount:
      type: object
      properties:
        id: { type: integer }
        sector: { type: string }
        open_job_count: { type: integer }

    EmploymentSectorBreakdownResponse:
      type: object
      properties:
        standard: { type: string }
        level: { type: string }

  # ============================================================
  # CRAWLER
  # ============================================================
  /crawler/sources:
    get:
      tags: [crawler]
      operationId: listCrawlerSources
      summary: "List the sources the crawler should run"
      description: >
        Sources that are of type `auto` and active.
      x-required-scope: crawler:sources
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /crawler/runs:
    post:
      tags: [crawler]
      operationId: startCrawlerRun
      summary: "Start a crawler run"
      description: >
        Takes no request body: the server creates the run (status `RUNNING`) and assigns its id.
        Any run still `RUNNING` is marked `FAILED` first (so a run that was killed
        without being completed does not stay `RUNNING`). This is not a mutual-exclusion
        guarantee: the database does not enforce a single `RUNNING` run, so two overlapping
        start requests can both succeed and leave two runs `RUNNING`. Callers should start
        runs from a single scheduler.
      x-required-scope: crawler:runs
      security:
        - BearerAuth: []
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlerRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /crawler/runs/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/idPath" }
    post:
      tags: [crawler]
      operationId: completeCrawlerRun
      summary: "Finish a crawler run"
      description: >
        Sets the run's final status and finish time. `status` must be `COMPLETED` or `FAILED`.
      x-required-scope: crawler:complete
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrawlerRunStatusChangeRequest" }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /crawler/jobs/batch-save:
    post:
      tags: [crawler]
      operationId: batchSaveJobs
      summary: "Ingest a batch of raw crawled jobs"
      description: >
        Each job is checked, de-duplicated, classified and stored independently; one failing job
        never blocks the rest *once the batch is accepted*. The response is **200 when the body is
        a non-empty JSON array whose elements all decode** - per-job failures are listed in
        `failed_jobs` (a job missing from it was saved, or was a duplicate whose crawler run was
        refreshed). The body is decoded as a whole before any job is processed, so it is rejected
        with **400, and no job in it is saved**, if it is not a JSON array, if the array is empty,
        or if any element has a wrongly typed field (e.g. `crawler_run_id` sent as a string
        instead of an integer). Missing fields are not a decode error; they are reported per job in
        `failed_jobs`. The response is sent after ingestion finishes, so it can take longer than a
        normal request.
      x-required-scope: crawler:batch-save
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchSavePayload" }
      responses:
        "200":
          description: "Batch processed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchSaveResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /crawler/jobs/reconcile:
    post:
      tags: [crawler]
      operationId: reconcileStaleVacancies
      summary: "Close stale vacancies after a run"
      description: >
        Sets `end_date` on every open job of the listed sources (active and not deleted) whose
        `crawler_run_id` is not the given run - i.e. jobs the run no longer saw. 404 if the run does not exist.
        The rule is "not the given run", not "older than the given run": a job that a **newer** run
        has refreshed (stamped with a later `crawler_run_id`) also matches and is closed. The
        backend does not check that the given run is still the latest, so a superseded run (one
        marked `FAILED` because a newer run started) that reconciles late can close vacancies the
        newer run just refreshed. Call this only for the most recent run, and only after it has
        finished saving its jobs.
      x-required-scope: crawler:reconcile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrawlerRunJobReconcileRequest" }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

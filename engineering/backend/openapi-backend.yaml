        standard: { type: string }
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        remote_vs_onsite_vs_hybrid:
          type: object
          properties:
            remote_count: { type: integer }
            on_site_count: { type: integer }
            hybrid_count: { type: integer }

    # ---- Occupation skills ----

    SkillDemand:
      type: object
      properties:
        id: { type: integer }
        skill: { type: string }
        open_job_count: { type: integer }

    SkillsResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillDemand" }

    EmployerDemand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    TopHiringEmployersResponse:
      type: object
      properties:
        level: { type: string }
        id: { type: integer }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        employers:
          type: array
          items: { $ref: "#/components/schemas/EmployerDemand" }

    # ---- National vacancy trend / totals ----

    VacancyTrendPoint:
      type: object
      properties:
        label: { type: string }
        open_job_count: { type: integer }

    VacancyTrendResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        granularity:
          type: string
          enum: [daily, monthly]
        count: { type: integer }
        data:
          type: array
          items: { $ref: "#/components/schemas/VacancyTrendPoint" }

    VacancyTotalResponse:
      type: object
      properties:
        from_date: { type: string }
        to_date: { type: string }
        total_vacancies: { type: integer }

    RootJobCount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        open_job_count: { type: integer }

    JobCountByDateRangeResponse:
      description: >
        Vacancy counts grouped by the root level of the standard (major group for
        occupation, industry sector for industry).
      type: object
      properties:
        standard: { type: string, enum: [occupation, industry] }
        from_date: { type: string }
        to_date: { type: string }
        count: { type: integer }
        data:
          type: array
          items: { $ref: "#/components/schemas/RootJobCount" }

    # ---- Crawler ----
    # Starting a run takes no request body; completing one only flips its status.

    CrawlerRun:
      type: object
      properties:
        id: { type: integer }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CrawlerRunStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [COMPLETED, FAILED]

    CrawlerRunJobReconcileRequest:
      type: object
      required: [crawler_run_id]
      properties:
        crawler_run_id: { type: integer }

    ReconcileResponse:
      type: object
      properties:
        message: { type: string }
        reconciled_stale_jobs: { type: integer }

    BatchSaveJobInput:
      type: object
      description: >
        One raw job posted by the crawler. No fields are validated at the HTTP layer;
        a job that cannot be processed is reported back in failed_jobs.
      properties:
        job_id:
          type: string
          description: Crawler-side job identifier, echoed back in failed_jobs.
          example: "3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b"
        employer: { type: string }
        job_role: { type: string }
        location: { type: string }
        description: { type: string }
        crawler_run_id:
          type: integer
          description: ID of the crawler run that produced this job.
        source:
          type: string
          description: Source of the job post (e.g. the job board name).

    BatchSavePayload:
      description: A non-empty JSON array of raw jobs (the body is the array itself, not an object).
      type: array
      minItems: 1
      items: { $ref: "#/components/schemas/BatchSaveJobInput" }

    BatchSaveResponse:
      type: object
      required:
        - message
        - submitted
        - failed_count
        - failed_jobs
      properties:
        message:
          type: string
          example: Batch processed
        submitted:
          type: integer
          description: Number of jobs in the submitted batch (failed ones included - see failed_count).
          example: 2
        failed_count:
          type: integer
          description: Number of jobs that failed processing.
          example: 1
        failed_jobs:
          type: array
          description: Details for each job that failed. Empty if all jobs succeeded.
          items:
            $ref: '#/components/schemas/FailedJob'

    FailedJob:
      type: object
      required:
        - job_id
        - status_code
        - error
      properties:
        job_id:
          type: string
          example: "22222222-2222-2222-2222-222222222222"
        status_code:
          type: integer
          description: >
            Why the job failed: 400 (no usable text), 422 (extraction/validation failure),
            503 (transient dependency failure - safe to retry).
          example: 503
        error:
          type: string
          example: 'job "Store Manager" at "Lanka Retail Group": transient extraction failure: deepseek returned status 429'


        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [sources]
      operationId: renameSource
      summary: "Rename a source"
      description: >
        Only manual sources can be renamed; an auto source is a 400 because its name must
        match the crawler's `SOURCE_NAME`.
      x-required-scope: sources:update
      security:
        - BearerAuth: []
      requestBody:

  # ============================================================
  # CRAWLER RUN MONITORING
  # ============================================================
  /crawler/runs:
    post:
      tags: [crawler]
      summary: Start new crawler run session
      description: Takes no request body - the server creates the run and assigns it an id.
      security:
        - BearerAuth: []
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlerRun" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /crawler/runs/{id}/complete:
    post:
      tags: [crawler]
      summary: Update crawler status
      security:
        - BearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/idPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CrawlerRunStatusChangeRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /crawler/jobs/batch-save:
    post:
      tags: [crawler]
      summary: Send raw jobs from the crawler to backend to save in database
      description: >
        Always 200 once the body parses; per-job failures are listed in failed_jobs.
        400 if the body is not a JSON array or the array is empty.
      security:

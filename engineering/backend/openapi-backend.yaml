  # ============================================================
  # GENERIC LEVEL-SCOPED ANALYSIS
  # ============================================================
  /{standard}/{level}/{id}/total-job-count:
    parameters:
      - { $ref: "#/components/parameters/standardPath" }
      - { $ref: "#/components/parameters/levelPath" }
      - { $ref: "#/components/parameters/idPath" }
      - { $ref: "#/components/parameters/fromDateRequired" }
      - { $ref: "#/components/parameters/toDateRequired" }
    get:
      tags: [analysis]
      operationId: getTotalJobCount
      summary: "Total job count for a hierarchy node"
      description: >
        Open-vacancy figures for the hierarchy node identified by `standard`, `level` and `id`, over the date range. A `level` that does not belong to `standard` is a 400. An unknown `id` returns zero counts, not a 404.
      security: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotalJobCountResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /{standard}/{level}/{id}/children:
    parameters:
      - { $ref: "#/components/parameters/standardPath" }
      - { $ref: "#/components/parameters/levelPath" }
      - { $ref: "#/components/parameters/idPath" }
      - { $ref: "#/components/parameters/fromDateRequired" }
      - { $ref: "#/components/parameters/toDateRequired" }
    get:
      tags: [analysis]
      operationId: getLevelChildren
      summary: "Child nodes with job counts"
      description: >
        Fails with 400 for a leaf level (`occupation-group`, `industry-subclass`), which has no children. Open-vacancy figures for the hierarchy node identified by `standard`, `level` and `id`, over the date range. A `level` that does not belong to `standard` is a 400. An unknown `id` returns zero counts, not a 404.
      security: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LevelChildrenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

